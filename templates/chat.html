<!DOCTYPE html>
<html>
<head>
    <title>CortexOne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="margin: 0; font-family: sans-serif; background-color: #121212; color: white;">

    <!-- Title Bar -->
    <h1 style="text-align: center; color: white; background-color: #1a1a1a; padding: 25px 0; margin: 1;">
        CortexOne
    </h1>

    <!-- Flex Container: Sessions Sidebar + Chat Area -->
    <div style="display: flex; width: 100%; height: calc(100vh - 60px);">

        <!-- Sidebar: Sessions -->
        <div style="width: 30%; max-width: 300px; background-color: #1a1a1a; padding: 20px; border-right: 1px solid #333; overflow-y: auto;">
            <h2 style="color: #ccc; margin-bottom: 15px; padding-left: 45px;">💬 Sessions</h2>
            <div style="margin-bottom: 10px;">
                <a href="/new" style="color: #eff2f6; font-weight: bold; padding-left: 45px;"> New Chat</a>
            </div>
            {% for session_id, name, timestamp in sessions %}
                <div style="margin-bottom: 10px;">
                    <a href="/session/{{ session_id }}" style="color: #c5d2e5;  padding-left: 45px;">
                        {{ name or 'Untitled Session' }}
                    </a>
                </div>
            {% endfor %}
        </div>

        <!-- Main Chat Area -->
        <div class="chat-container" style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto;">
            <div id="chat-box" style="flex-grow: 1; overflow-y: auto;">
                {% if chats %}
                    {% for user_msg, bot_msg, timestamp in chats %}
                        <div class="chat-message user">
                            <div class="message-text">{{ user_msg }}</div>
                            <div class="timestamp">{{ timestamp }}</div>
                        </div>
                        <div class="chat-message bot">
                            <div class="message-text">{{ bot_msg }}</div>
                            <div class="timestamp">{{ timestamp }}</div>
                        </div>
                    {% endfor %}
                {% endif %}
            </div>
            <div class="input-area" style="margin-top: 20px;">
                <input type="text" id="user-input" placeholder="Type your message..." style="width: 80%;">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

    <!-- Script -->
    <script>
        async function sendMessage() {
            const userInput = document.getElementById('user-input');
            const userMessage = userInput.value.trim();

            if (userMessage === '') {
                alert("Please type a message before sending.");
                return;
            }

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: userMessage }),
                });

                if (!response.ok) throw new Error("Network response was not ok");

                const data = await response.json();
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML += `<div class="chat-message user"><span>${userMessage}</span></div>`;
                chatBox.innerHTML += `<div class="chat-message bot"><span>${data.reply}</span></div>`;
                userInput.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                console.error("Error sending message:", error);
                document.getElementById('chat-box').innerHTML += `<p><em>Error: Failed to send message.</em></p>`;
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

</body>
</html>
